<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Details</title>
  <link href="css/index.css" rel="stylesheet">
  <script src="js/details.js"></script>
</head>
<body>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Student Information</h5>
          <a href="students.html" class="btn btn-sm btn-light">Back</a>
        </div>
        <div class="card-body pl-4" style="font-size: 18px; line-height: 2;">
          <p class="mb-1"><strong>ID:</strong> <span id="detail_id"></span></p>
          <p class="mb-1"><strong>Name:</strong> <span id="detail_name"></span></p>
          <p class="mb-1"><strong>Surname:</strong> <span id="detail_surname"></span></p>
          <p class="mb-1"><strong>Email:</strong> <span id="detail_email"></span></p>
          <p class="mb-1"><strong>Age:</strong> <span id="detail_age"></span></p>
          <p class="mb-1"><strong>University:</strong> <span id="detail_university"></span></p>
          <p class="mb-1"><strong>Faculty:</strong> <span id="detail_faculty"></span></p>
          <p class="mb-1"><strong>Major:</strong> <span id="detail_major"></span></p>
          <p class="mb-1"><strong>GPA:</strong> <span id="detail_gpa"></span></p>
          <p class="mb-1"><strong>Scholarship:</strong> <span id="detail_scholarship"></span></p>
          <p class="mb-1"><strong>Timeframe:</strong> <span id="detail_timeframe"></span></p>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
