<!DOCTYPE>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
    <link href="css/index.css" rel="stylesheet" >
    <script src="js/index.js" ></script>

</head>
<body>
<h1>Students</h1>
<div class="container">
    <div class="row">
        <div class="col-auto">
            <label for="name" class="form-label">name</label>
            <input type="text" class="form-control" name="name" id="name" placeholder="name" value="">
        </div>
        <div class="col-auto">
            <label for="surname" class="form-label">surname</label>
            <input type="text" class="form-control" name="surname" id="surname" placeholder="surname" value="">
        </div>
        <div class="col-auto">
            <label for="age" class="form-label">age</label>
            <input type="text" class="form-control" name="age" id="age" placeholder="age" value="">
        </div>
        <div class="col-auto">
            <label for="email" class="form-label">email</label>
            <input type="text" class="form-control" name="email" id="email" placeholder="email" value="">
        </div>
        <div class="col-auto">
            <label for="password" class="form-label">password</label>
            <input type="text" class="form-control" name="password" id="password" placeholder="password" value="">
        </div>
        <div class="col-auto">
            <label for="surname" class="form-label">university</label>
            <select class="form-select" name="university" id="university_id">
                <!--filled by backend-->
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-1">
            <button type="button" class="btn btn-primary" onclick="getStudents()">Search</button>
        </div>
        <div class="col-1">
            <a type="button" class="btn btn-primary mt-3" data-toggle="modal" data-target="#modalStudentsInsert">Insert</a>
        </div>
    </div>
</div>

<table class="table">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Surname</th>
        <th>Age</th>
        <th>Email</th>
        <th>Password</th>
        <th>University</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody id="tbl-students-body">

    </tbody>
</table>

<table style="display: none">
    <tbody id="tbl-students-body-tr">
    <tr>
        <td>
            :id
        </td>
        <td>
            :name
        </td>
        <td>
            :surname
        </td>
        <td>
            :age
        </td>
        <td>
            :email
        </td>
        <td>
            :password
        </td>
        <td>
            :university
        </td>
        <td>
            <button onclick="select(:id)" class="btn btn-danger" data-toggle="modal" data-target="#modalStudentsDelete">Delete</button>
            <button onclick="select(:id)" class="btn btn-info" data-toggle="modal" data-target="#modalStudentsInsert">Update</button>
        </td>
    </tr>
    </tbody>
</table>

<!-- Modal -->
<div class="modal fade" id="modalStudentsDelete" tabindex="-1" role="dialog" aria-labelledby="studentDeleteModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="studentDeleteModalLabel">Delete Action</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                Are you sure to delete?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                <button type="button" class="btn btn-danger" onclick="deleteStudent(selectedId)" data-dismiss="modal">Yes</button>
            </div>
        </div>
    </div>
</div>
<!-- Modal -->
<div class="modal fade" id="modalStudentsInsert" tabindex="-1" role="dialog" aria-labelledby="modalStudentsInsertLabel" aria-hidden="true">
    <div class="modal-dialog" role="document" >
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalStudentsInsertLabel">Create Student</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="container">
                    <div class="row col-5">
                        <label for="name" class="form-label">name</label>
                        <input type="text" class="form-control" name="Name" id="create_name" placeholder="name">
                    </div>

                    <div class="row col-5">
                        <label for="surname" class="form-label">surname</label>
                        <input type="text" class="form-control" name="Surname" id="create_surname" placeholder="surname">
                    </div>

                    <div class="row col-5">
                        <label for="age" class="form-label">age</label>
                        <input type="text" class="form-control" name="Age" id="create_age" placeholder="age">
                    </div>

                    <div class="row col-5">
                        <label for="Email" class="form-label">email</label>
                        <input type="text" class="form-control" name="Email" id="create_email" placeholder="email">
                    </div>
                    <div class="row col-5">
                        <label for="Password" class="form-label">password</label>
                        <input type="text" class="form-control" name="Password" id="create_password" placeholder="password">
                    </div>

                    <div class="row col-5">
                        <label for="university_id" class="form-label">university</label>
                        <select class="form-select" id="create_university_id">
                           <!-- filled by backend-->
                        </select>
                    </div>
                </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="insertStudent()" data-dismiss="modal">Save</button>
            </div>

        </div>
    </div>
</div>
</body>
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>
</html>
